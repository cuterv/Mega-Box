<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>MegaBox</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header id="window-titlebar" class="window-titlebar">
      <div class="window-titlebar-drag" data-window-drag>
        <span class="window-titlebar-mark">M</span>
        <span id="window-titlebar-name">MegaBox</span>
      </div>
      <div id="window-titlebar-controls"></div>
    </header>
    <div id="app">
      <div class="boot">
        <div class="boot-mark">M</div>
        <div class="boot-pulse"></div>
      </div>
    </div>
    <div id="drop-overlay" class="drop-overlay" hidden>
      <div class="drop-card">
        <div class="drop-icon">↓</div>
        <strong>释放以导入素材</strong>
        <span>支持 PNG、JPG、WebP、GIF 和 TIFF</span>
      </div>
    </div>
    <div id="toast-stack" class="toast-stack"></div>
    <script src="app.js"></script>
  </body>
</html>
